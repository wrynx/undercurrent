# Install once with `pre-commit install`; run on everything with
# `pre-commit run --all-files`. Bump revs with `pre-commit autoupdate` and keep
# the ruff rev in step with the `ruff` pin in pyproject.toml's `dev` extra.
exclude: ^docs/_legacy/
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.9
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        # mkdocs.yml uses a !!python/name tag (the mermaid fence), which safe_load rejects.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-merge-conflict
      # Guards against committing model checkpoints again.
      - id: check-added-large-files
        args: [--maxkb=1024]
  - repo: https://github.com/kynan/nbstripout
    rev: 0.8.1
    hooks:
      # Commit notebooks without outputs or execution counts.
      - id: nbstripout
