# Release: pushing a `v*` tag builds the package once, smoke-tests the built
# artefacts, publishes them with PyPI Trusted Publishing (OIDC, with
# attestations) and creates the GitHub Release. See RELEASING.md for the
# maintainer checklist.
#
#   build ──> smoke (3.10, 3.13) ──> publish-testpypi  (pre-release tags: v0.1.0rc1, v0.2.0b2)
#                               └──> publish-pypi      (final tags: v0.1.0)
#                                          └──> github-release
#
# Exactly one index is published to, decided by
# `packaging.version.Version(tag).is_prerelease` in the build job. A
# pre-release can never reach PyPI and a final release never goes only to
# TestPyPI. No API tokens or other secrets are used anywhere.
#
# One-time human setup (must match this file exactly; don't rename the file,
# the jobs' environments or the repository without updating all of it):
#   1. PyPI (https://pypi.org/manage/account/publishing/): add a trusted
#      publisher for project `undercurrent` with owner `wrynx`, repository
#      `undercurrent`, workflow `release.yml`, environment `pypi`.
#   2. TestPyPI (https://test.pypi.org/manage/account/publishing/): the same,
#      with environment `testpypi`.
#   3. GitHub repository settings -> Environments: create `pypi` (with a
#      required reviewer, so a maintainer approves every real release) and
#      `testpypi`. Optionally restrict both to tags matching `v*`.
#
# No container image is published in v0.1 (deferred; see ROADMAP.md).
name: Release

on:
  push:
    tags: ["v*"]

# Read-only by default. Write permissions are granted per job, only where
# needed (id-token on the publish jobs, contents on github-release).
permissions:
  contents: read

# Deliberately no `concurrency` block: a release must never be cancelled
# half-way (e.g. published to PyPI but no GitHub Release). Each tag is its own
# ref, so runs for different tags don't interfere.

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.classify.outputs.version }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: hatch-vcs derives the version from the tag.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install build twine packaging

      - name: Classify the tag
        id: classify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYEOF'
          import os
          import sys

          from packaging.version import InvalidVersion, Version

          tag = os.environ["TAG"]
          if not tag.startswith("v"):
              sys.exit(f"::error::tag {tag!r} does not start with 'v'")
          raw = tag[1:]
          try:
              version = Version(raw)
          except InvalidVersion:
              sys.exit(f"::error::tag {tag!r} is not 'v' + a PEP 440 version")
          # Require the canonical spelling so the tag, the built version and the
          # uploaded filenames all agree (e.g. reject v0.1.0-rc.1, use v0.1.0rc1).
          if str(version) != raw:
              sys.exit(f"::error::tag {tag!r} is not canonical PEP 440; use 'v{version}'")
          if version.local is not None:
              sys.exit(f"::error::tag {tag!r} has a local version segment, which PyPI rejects")
          prerelease = "true" if version.is_prerelease else "false"
          print(f"version={raw} prerelease={prerelease}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"version={raw}\nprerelease={prerelease}\n")
          PYEOF

      - name: Build sdist and wheel
        run: python -m build

      - name: Check the built version matches the tag
        env:
          EXPECTED: ${{ steps.classify.outputs.version }}
        run: |
          python - <<'PYEOF'
          import email
          import glob
          import os
          import sys
          import tarfile
          import zipfile

          expected = os.environ["EXPECTED"]
          wheels = glob.glob("dist/*.whl")
          sdists = glob.glob("dist/*.tar.gz")
          if len(wheels) != 1 or len(sdists) != 1:
              sys.exit(f"::error::expected one wheel and one sdist in dist/, found {wheels + sdists}")

          with zipfile.ZipFile(wheels[0]) as zf:
              meta = [n for n in zf.namelist() if n.endswith(".dist-info/METADATA")]
              wheel_version = email.message_from_bytes(zf.read(meta[0]))["Version"]
          with tarfile.open(sdists[0]) as tf:
              pkg_info = next(m for m in tf.getmembers() if m.name.count("/") == 1 and m.name.endswith("/PKG-INFO"))
              sdist_version = email.message_from_bytes(tf.extractfile(pkg_info).read())["Version"]

          print(f"tag version:   {expected}")
          print(f"wheel version: {wheel_version} ({os.path.basename(wheels[0])})")
          print(f"sdist version: {sdist_version} ({os.path.basename(sdists[0])})")
          if wheel_version != expected or sdist_version != expected:
              sys.exit(
                  f"::error::built version (wheel {wheel_version}, sdist {sdist_version}) does not match "
                  f"tag version {expected}. Is the tag on the checked-out commit, and was history fetched?"
              )
          PYEOF

      - name: twine check
        run: python -m twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke test artefacts (Python ${{ matrix.python-version }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Only for scripts/smoke_test_wheel.sh; nothing is built here.
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run scripts/smoke_test_wheel.sh against the built artefacts
        env:
          # The base install includes torch; CPU wheels avoid multi-GB CUDA
          # downloads. The script's pip calls inherit this.
          PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
        run: bash scripts/smoke_test_wheel.sh --dist dist --python python

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, smoke]
    # Pre-releases only. Compares against the exact string, so a missing or
    # unexpected classification publishes nowhere.
    if: needs.build.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: testpypi
      url: https://test.pypi.org/project/undercurrent/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true

  publish-pypi:
    name: Publish to PyPI
    needs: [build, smoke]
    # Final releases only (see publish-testpypi).
    if: needs.build.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/undercurrent/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # OIDC token for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true

  github-release:
    name: Create GitHub Release
    needs: [build, publish-testpypi, publish-pypi]
    # One publish job always skips. Run once whichever one applied succeeded.
    if: >-
      !cancelled()
      && needs.build.result == 'success'
      && ((needs.build.outputs.prerelease == 'true' && needs.publish-testpypi.result == 'success')
          || (needs.build.outputs.prerelease == 'false' && needs.publish-pypi.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release and upload its assets
    steps:
      - uses: actions/checkout@v4
        with:
          # Only for CHANGELOG.md.
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python - <<'PYEOF'
          import os
          import re

          version = os.environ["VERSION"]
          heading = re.compile(r"^## \[" + re.escape(version) + r"\]")
          # The section ends at the next `## ` heading or the link definitions.
          end = re.compile(r"^(## |\[[^\]]+\]: )")
          body, inside = [], False
          try:
              with open("CHANGELOG.md", encoding="utf-8") as fh:
                  for line in fh:
                      if inside and end.match(line):
                          break
                      if inside:
                          body.append(line)
                      elif heading.match(line):
                          inside = True
          except FileNotFoundError:
              pass
          notes = "".join(body).strip()
          found = "true" if notes else "false"
          if notes:
              with open("release-notes.md", "w", encoding="utf-8") as fh:
                  fh.write(notes + "\n")
              print(f"Using the CHANGELOG.md section for {version} ({len(notes)} chars)")
          else:
              print(f"No CHANGELOG.md section for {version}; GitHub will generate notes")
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"found={found}\n")
          PYEOF

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          HAS_NOTES: ${{ steps.notes.outputs.found }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "$TAG")
          if [[ "$HAS_NOTES" == "true" ]]; then
              args+=(--notes-file release-notes.md)
          else
              args+=(--generate-notes)
          fi
          if [[ "$PRERELEASE" == "true" ]]; then
              args+=(--prerelease)
          fi
          gh release create "$TAG" dist/* "${args[@]}"
